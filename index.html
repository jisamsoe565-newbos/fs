  <style>
    * {

    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(34,197,94,.14),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #07090d 0%,
          #0b0f15 100%
        );

      color: #fff;
      padding: 18px 12px 24px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .post {
      background: rgba(15, 18, 24, .98);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.48);
    }

    /* THUMBNAIL */
    .cover {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 50%,
        rgba(0,0,0,.4) 100%
      );
      pointer-events: none;
    }

    .cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* CONTENT */
    .content {
      padding: 20px 18px 18px;
    }

    .brand {
      display: flex;

      gap: 9px;
      margin-bottom: 15px;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 14px rgba(34,197,94,.8);
      flex: 0 0 auto;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .35px;
      color: #dbe4ee;
    }

    .status {

      color: #86efac;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .45px;
    }

    .status i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 7px #22c55e;
    }

    /* TITLE */
    h1 {
      font-size: 22px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -.35px;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    /* BUTTON */
    .links-group {
      display: block;
      width: 100%;
    }

    .link {
      position: relative;

      display: flex;
      align-items: center;

      width: 100%;
      min-height: 64px;

      padding: 12px 15px;

      border-radius: 15px;

      text-decoration: none;
      color: #ffffff;

      /* BUTTON LEBIH TERANG */
      background: linear-gradient(
        135deg,
        #22c55e 0%,
        #16a34a 100%
      );

      border: 1px solid rgba(134,239,172,.65);

      box-shadow:
        0 8px 24px rgba(34,197,94,.25),
        inset 0 1px 0 rgba(255,255,255,.25);

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
    }

    .link:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px rgba(34,197,94,.35),
        inset 0 1px 0 rgba(255,255,255,.3);

      filter: brightness(1.06);
    }

    .link:active {
      transform: scale(.98);
    }

    /* ICON */
    .icon {
      width: 40px;
      height: 40px;

      border-radius: 11px;

      display: grid;
      place-items: center;

      margin-right: 12px;

      background: rgba(0,0,0,.18);
      color: #ffffff;

      font-size: 17px;
      font-weight: 800;

      flex: 0 0 auto;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15);
    }

    /* TEXT */
    .button-text {
      min-width: 0;
      flex: 1;
    }

    .button-title {
      display: block;

      font-size: 15px;
      font-weight: 800;
      line-height: 1.25;

      color: #ffffff;
    }

    .button-sub {
      display: block;

      margin-top: 3px;

      font-size: 10px;
      font-weight: 600;

      color: rgba(255,255,255,.78);

      line-height: 1.25;
    }

    /* ARROW */
    .arrow {
      color: #ffffff;
      font-size: 25px;
      font-weight: 300;

      margin-left: 8px;

      line-height: 1;
    }

    /* INFO */
    .meta {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;

      margin-top: 17px;
      padding: 10px 8px;

      border-top: 1px solid rgba(255,255,255,.07);

      color: #718096;

      font-size: 10px;
      font-weight: 600;
    }

    .meta span {
      white-space: nowrap;
    }

    /* FOOTER */
    .footer {
      text-align: center;

      margin-top: 12px;

      color: #4f5b6b;
      font-size: 9px;
      letter-spacing: .2px;
    }

    /* MOBILE */
    @media (max-width: 360px) {

      body {
        padding-left: 9px;
        padding-right: 9px;
      }

      .content {
        padding: 17px 14px 15px;
      }

      h1 {
        font-size: 20px;
      }

      .status {
        font-size: 9px;
      }

      .link {
        min-height: 61px;
        padding: 11px 12px;
      }

      .icon {
        width: 37px;
        height: 37px;
        margin-right: 10px;
      }

      .button-title {
        font-size: 14px;
      }
    }
  </style>
</head>
