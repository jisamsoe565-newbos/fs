
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freaky Leaks</title>

<meta name="description" content="Freaky Leaks — Featured stories and entertainment.">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  background:#050505;
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%, #202020 0%, #0a0a0a 38%, #050505 75%);
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  padding:16px 10px 30px;
}

.page{
  width:100%;
  max-width:450px;
  margin:0 auto;
}

/* =========================
   MAIN CARD
========================= */

.card{
  background:#0d0d0d;
  border:1px solid #242424;
  border-radius:18px;
  overflow:hidden;

  box-shadow:
    0 18px 55px rgba(0,0,0,.55),
    0 2px 8px rgba(0,0,0,.35);
}

/* =========================
   BRAND BAR
========================= */

.brand{
  height:58px;
  padding:0 17px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:#0b0b0b;
  border-bottom:1px solid #202020;
}

.brand-name{
  font-size:16px;
  font-weight:800;
  letter-spacing:.7px;
  text-transform:uppercase;
}

.brand-name span{
  color:#b9ff00;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;

  color:#8d8d8d;
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.6px;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#b9ff00;
  box-shadow:0 0 8px rgba(185,255,0,.65);
}

/* =========================
   IMAGE
========================= */

.thumbnail{
  width:100%;
  background:#000;
  overflow:hidden;
}

.thumbnail img{
  display:block;
  width:100%;
  height:auto;

  object-fit:cover;
}

/* =========================
   CONTENT
========================= */

.content{
  padding:20px 18px 18px;
}

.eyebrow{
  color:#a9a9a9;
  font-size:10px;
  font-weight:700;
  letter-spacing:1.3px;
  text-transform:uppercase;
  margin-bottom:7px;
}

.title{
  color:#fff;
  font-size:27px;
  line-height:1.15;
  font-weight:800;
  letter-spacing:-.6px;
  margin-bottom:8px;
}

.description{
  color:#969696;
  font-size:13px;
  line-height:1.55;
  margin-bottom:18px;
}

/* =========================
   PRIMARY CTA
========================= */

.primary{
  position:relative;

  width:100%;
  min-height:53px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  border-radius:11px;

  background:#b9ff00;
  color:#050505;

  text-decoration:none;

  font-size:15px;
  font-weight:800;
  letter-spacing:.15px;

  box-shadow:
    0 7px 22px rgba(185,255,0,.13);

  transition:
    transform .15s ease,
    filter .15s ease;
}

.primary-icon{
  width:24px;
  height:24px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#050505;
  color:#b9ff00;

  border-radius:50%;

  font-size:10px;
}

.primary:active{
  transform:scale(.985);
}

.primary:hover{
  filter:brightness(1.05);
}

/* =========================
   SECONDARY
========================= */

.secondary{
  width:100%;
  min-height:45px;

  margin-top:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #2b2b2b;
  border-radius:10px;

  background:#151515;
  color:#c9c9c9;

  text-decoration:none;

  font-size:13px;
  font-weight:650;

  transition:
    background .15s ease,
    border-color .15s ease;
}

.secondary:hover{
  background:#1b1b1b;
  border-color:#383838;
}

/* =========================
   DIVIDER
========================= */

.divider{
  width:100%;
  height:1px;

  background:#222;

  margin:18px 0 13px;
}

/* =========================
   INFO
========================= */

.info{
  display:flex;
  align-items:flex-start;
  gap:9px;

  color:#737373;

  font-size:10.5px;
  line-height:1.5;
}

.info-icon{
  flex:none;

  width:19px;
  height:19px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #343434;
  border-radius:50%;

  color:#858585;

  font-size:10px;
}

/* =========================
   FOOTER
========================= */

.footer{
  padding:13px 10px 0;

  text-align:center;

  color:#555;

  font-size:9px;
  letter-spacing:.7px;
  text-transform:uppercase;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

  body{
    padding:9px 8px 24px;
  }

  .page{
    max-width:430px;
  }

  .card{
    border-radius:15px;
  }

  .brand{
    height:54px;
    padding:0 15px;
  }

  .brand-name{
    font-size:14px;
  }

  .status{
    font-size:9px;
  }

  .content{
    padding:18px 15px 16px;
  }

  .title{
    font-size:24px;
  }

  .description{
    font-size:12.5px;
    margin-bottom:16px;
  }

  .primary{
    min-height:51px;
    font-size:14px;
  }

  .secondary{
    min-height:44px;
    font-size:12.5px;
  }
}
</style>

</head>

<body>

<div class="page">

  <main class="card">

    <!-- BRAND HEADER -->
    <div class="brand">

      <div class="brand-name">
        Freaky <span>Leaks</span>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Featured
      </div>

    </div>


    <!-- CLEAN THUMBNAIL -->
    <div class="thumbnail">

      <img
        src="https://i.imgur.com/Ue4hWlv.jpeg"

        loading="eager"
      >

    </div>


    <!-- CONTENT -->
    <section class="content">

      <div class="eyebrow">

      <h1 class="title">

      </h1>

      <p class="description">

      <!-- MAIN CTA -->
      <a
        class="primary"
        href="https://bioku.my/IA9vgv"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="primary-icon">▶</span>

        Watch Full Video

      </a>


      <!-- ALTERNATIVE -->
      <a
        class="secondary"
        href="https://viralmomenthub.blogspot.com/?v=lGmaE4gT1"
        target="_blank"
        rel="noopener noreferrer"
      >
        Alternative Viewing
      </a>


      <div class="divider"></div>


      <!-- INFO -->
      <div class="info">

        <div class="info-icon">i</div>

        <div>
          Video availability and loading speed may vary
          depending on your connection and device.
        </div>

      </div>

    </section>

  </main>


  <div class="footer">
    Freaky Leaks · Featured Entertainment
  </div>

</div>
